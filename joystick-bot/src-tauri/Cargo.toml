[package]
name = "joystick-bot"
version = "0.1.0"
description = "StatusForge Joystick Bot — Joystick.tv category push + chat bot addon"
authors = ["BearddOddity"]
license = "MIT"
repository = "https://github.com/BearddOddity/StatusForge.io"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "joystick_bot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
log = "0.4"

dirs = "5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
keyring = "3"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
axum = "0.8"
