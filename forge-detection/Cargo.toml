[package]
name = "forge-detection"
version = "1.0.0"
description = "GameDetector — game detection engine (Windows / macOS / Linux). Shared by StatusForge, Blipy, and StreamerSuite."
authors = ["BearddOddity"]
license = "MIT"
repository = "https://github.com/BearddOddity/StatusForge.io"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.33"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }
winreg = "0.52"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSWorkspace", "NSRunningApplication", "libc"] }
objc2-foundation = "0.2"
core-graphics = "0.24"
core-foundation = "0.10"
plist = "1"
