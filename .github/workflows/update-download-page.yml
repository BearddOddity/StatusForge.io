# Keeps statusforge/download.html AND the Addons section of
# statusforge/index.html on BearddOddity.github.io in sync with whatever's
# actually published — these pages previously had hand-updated
# links/badges that silently went stale.
#
# The download.html sync runs automatically for the StatusForge release
# itself, not Blipy/Joystick Companion (they always publish to their own
# moving "*-latest" tags as prereleases; the `if:` below filters those
# release events out so this doesn't fire twice per StatusForge release).
# The Addons section sync always pulls blipy-latest/joystick-latest
# directly by tag regardless of what triggered the run, since it's not
# tied to whichever app's release fired the event. Can also be run
# manually (Actions tab -> this workflow -> "Run workflow") to sync
# everything against current state, e.g. to verify the deploy key/secret
# are set up correctly without waiting for a real release.
#
# Requires a deploy key with write access to BearddOddity.github.io,
# stored here as the PAGES_DEPLOY_SSH_KEY secret (Settings > Secrets and
# variables > Actions). See scripts/update-download-page.mjs for the
# asset -> platform matching logic, scripts/update-addons-section.mjs for
# the addon badges/links.

name: Update download page

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  update-download-page:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout StatusForge.io
        uses: actions/checkout@v4

      - name: Checkout BearddOddity.github.io
        uses: actions/checkout@v4
        with:
          repository: BearddOddity/BearddOddity.github.io
          ssh-key: ${{ secrets.PAGES_DEPLOY_SSH_KEY }}
          path: pages-site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release JSON
        env:
          RELEASE_EVENT_JSON: ${{ toJson(github.event.release) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            printf '%s' "$RELEASE_EVENT_JSON" > release.json
          else
            gh api "repos/${{ github.repository }}/releases/latest" > release.json
          fi

      - name: Update download.html
        run: node scripts/update-download-page.mjs pages-site/statusforge/download.html release.json

      - name: Resolve addon release JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/blipy-latest" > blipy-release.json \
            || echo '{}' > blipy-release.json
          gh api "repos/${{ github.repository }}/releases/tags/joystick-latest" > joystick-release.json \
            || echo '{}' > joystick-release.json

      - name: Update Addons section
        run: node scripts/update-addons-section.mjs pages-site/statusforge/index.html blipy-release.json joystick-release.json

      - name: Commit and push
        working-directory: pages-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add statusforge/download.html statusforge/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: sync StatusForge download page + addons section to $(node -p "require('../release.json').tag_name" 2>/dev/null || echo latest)"
          git push
