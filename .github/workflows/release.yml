# Release builds — one installer per OS for BOTH apps (StatusForge + Blipy).
# This is the canonical build path: Tauri bundles are produced on their own
# OS runner (no local cross-compilation).
#
# Triggers: pushing a version tag (git tag v0.5.0 && git push --tags) or
# manual "Run workflow" in the Actions tab.
#
# Releases:
# - StatusForge → release "v__VERSION__" (regular release, so
#   /releases/latest/download/latest.json always resolves to StatusForge)
# - Blipy       → moving tag "blipy-latest" (marked prerelease so it never
#   claims /releases/latest); its updater endpoint is
#   /releases/download/blipy-latest/latest.json
#
# Secrets required (updater artifact signing — minisign, independent of
# Apple code signing):
# - TAURI_SIGNING_PRIVATE_KEY           (contents of ~/.tauri/statusforge.key)
# - TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (empty string if key has no password)
#
# macOS ships UNSIGNED and un-notarized by design (no Apple account) — the
# job succeeds and emits an unsigned .dmg/.app. See the commented block at
# the bottom to enable Apple signing later.
#
# Flatpak: not a native Tauri bundle target, so the `flatpak` job below runs
# after `build` and wraps the just-published Linux .deb into a Flatpak
# single-file bundle (manifests in flatpak/), uploaded as an extra asset on
# the same release. This is a distributable .flatpak bundle, not a Flathub
# submission (that's a separate, manual repo-review process).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        app:
          - name: StatusForge
            path: "."
            tagName: v__VERSION__
            releaseName: "StatusForge v__VERSION__"
            prerelease: false
          - name: Blipy
            path: blipy-app
            tagName: blipy-latest
            releaseName: "Blipy v__VERSION__"
            prerelease: true
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.app.name }} (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            blipy-app/src-tauri
            forge-detection

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm install

      # Bundles per OS: Windows NSIS + MSI, macOS .app + .dmg (unsigned),
      # Linux AppImage + .deb — tauri.conf.json "targets": "all" covers these.
      - name: Build and release ${{ matrix.app.name }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ── To enable macOS signing + notarization later, add the Apple
          # secrets and uncomment (no code changes needed): ────────────────
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: ${{ matrix.app.path }}
          tagName: ${{ matrix.app.tagName }}
          releaseName: ${{ matrix.app.releaseName }}
          releaseBody: "See the assets below for this platform's installer."
          releaseDraft: false
          prerelease: ${{ matrix.app.prerelease }}
          includeUpdaterJson: true

  # Wraps each app's just-published Linux .deb into a Flatpak single-file
  # bundle and attaches it to the same release. Runs after `build` so the
  # release + .deb asset already exist to download from.
  flatpak:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: StatusForge
            id: com.bearddoddity.statusforge
            debName: statusforge.deb
            manifest: com.bearddoddity.statusforge.yml
            versionFile: src-tauri/tauri.conf.json
            isBlipy: false
          - name: Blipy
            id: com.bearddoddity.blipy
            debName: blipy.deb
            manifest: com.bearddoddity.blipy.yml
            versionFile: blipy-app/src-tauri/tauri.conf.json
            isBlipy: true
    name: Flatpak (${{ matrix.app.name }})
    steps:
      - uses: actions/checkout@v4

      # StatusForge tags as v<version> (tauri-action expands __VERSION__ at
      # build time); Blipy always tags as the moving blipy-latest.
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ matrix.app.isBlipy }}" = "true" ]; then
            echo "tag=blipy-latest" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./${{ matrix.app.versionFile }}').version")
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//46 org.gnome.Sdk//46

      - name: Download ${{ matrix.app.name }}'s .deb from its release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p flatpak
          gh release download "${{ steps.tag.outputs.tag }}" --pattern '*.deb' --dir flatpak --clobber --repo "${{ github.repository }}"

      - name: Rename .deb to what the manifest expects
        working-directory: flatpak
        run: mv -f *.deb ${{ matrix.app.debName }}

      - name: Build Flatpak bundle
        working-directory: flatpak
        run: |
          flatpak-builder --user --force-clean --repo=repo build ${{ matrix.app.manifest }}
          flatpak build-bundle repo ${{ matrix.app.id }}.flatpak ${{ matrix.app.id }}

      - name: Upload Flatpak bundle to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" "flatpak/${{ matrix.app.id }}.flatpak" --clobber --repo "${{ github.repository }}"

  # A release created with the default GITHUB_TOKEN (which tauri-action uses
  # above) does NOT fire the `release: published` event for other workflows
  # in this repo — that's a deliberate GitHub Actions anti-recursion rule,
  # not a bug. update-download-page.yml's `on: release` trigger is dead as a
  # result, so it's dispatched explicitly here instead once every asset
  # (including the Flatpak wraps) actually exists on the release.
  sync-download-page:
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger download-page sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update-download-page.yml --repo "${{ github.repository }}" --ref development_phase
