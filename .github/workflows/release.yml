# Release builds — one installer per OS for all three apps (StatusForge +
# Blipy + Joystick Companion). This is the canonical build path: Tauri
# bundles are produced on their own OS runner (no local cross-compilation).
#
# Triggers: pushing a version tag (git tag v0.5.0 && git push --tags) or
# manual "Run workflow" in the Actions tab.
#
# Releases:
# - StatusForge      → release "v__VERSION__" (regular release, so
#   /releases/latest/download/latest.json always resolves to StatusForge)
# - Blipy             → moving tag "blipy-latest" (marked prerelease so it
#   never claims /releases/latest); its updater endpoint is
#   /releases/download/blipy-latest/latest.json
# - Joystick Companion → moving tag "joystick-latest" (also prerelease),
#   same reasoning as Blipy. Note it doesn't have an in-app updater yet
#   (no tauri-plugin-updater dependency) — the moving tag just gives it a
#   stable download URL; nothing in the app itself checks it.
#
# Secrets required (updater artifact signing — minisign, independent of
# Apple code signing):
# - TAURI_SIGNING_PRIVATE_KEY           (contents of ~/.tauri/statusforge.key)
# - TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (empty string if key has no password)
#
# macOS ships UNSIGNED and un-notarized by design (no Apple account) — the
# job succeeds and emits an unsigned .dmg/.app. See the commented block at
# the bottom to enable Apple signing later.
#
# Flatpak: not a native Tauri bundle target, so the `flatpak` job below runs
# after `build` and wraps the just-published Linux .deb into a Flatpak
# single-file bundle (manifests in flatpak/), uploaded as an extra asset on
# the same release. This is a distributable .flatpak bundle, not a Flathub
# submission (that's a separate, manual repo-review process).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        app:
          - name: StatusForge
            path: "."
            tagName: v__VERSION__
            releaseName: "StatusForge v__VERSION__"
            prerelease: false
            # Cargo package name (target/release/<binName>[.exe]) — differs
            # from productName, which is only used inside the bundled
            # installers, not the raw cargo build output.
            binName: app
            slug: statusforge
            versionFile: src-tauri/tauri.conf.json
            releaseTag: v
            # Portable build needs the same files bundle.resources copies
            # into each installer, since the app reads them relative to its
            # own exe (see app_base_dir() in src-tauri/src/lib.rs).
            resources: "widgets Config.json.template public"
          - name: Blipy
            path: blipy-app
            tagName: blipy-latest
            releaseName: "Blipy v__VERSION__"
            prerelease: true
            binName: blipy
            slug: blipy
            versionFile: blipy-app/src-tauri/tauri.conf.json
            releaseTag: blipy-latest
            resources: ""
          - name: Joystick Companion
            path: joystick-bot
            tagName: joystick-latest
            releaseName: "Joystick Companion v__VERSION__"
            prerelease: true
            binName: joystick-bot
            slug: joystickbot
            versionFile: joystick-bot/src-tauri/tauri.conf.json
            releaseTag: joystick-latest
            resources: ""
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.app.name }} (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            blipy-app/src-tauri
            joystick-bot/src-tauri
            forge-detection

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm install

      # Bundles per OS: Windows NSIS + MSI, macOS .app + .dmg (unsigned),
      # Linux AppImage + .deb — tauri.conf.json "targets": "all" covers these.
      - name: Build and release ${{ matrix.app.name }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ── To enable macOS signing + notarization later, add the Apple
          # secrets and uncomment (no code changes needed): ────────────────
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: ${{ matrix.app.path }}
          tagName: ${{ matrix.app.tagName }}
          releaseName: ${{ matrix.app.releaseName }}
          releaseBody: "See the assets below for this platform's installer."
          releaseDraft: false
          prerelease: ${{ matrix.app.prerelease }}
          includeUpdaterJson: true

      # tauri-action's tagName above is the literal "v__VERSION__"/moving-tag
      # config value, not the real resolved tag on the release it just
      # created — need the actual tag string to `gh release upload` against.
      # releaseTag is "v" as a sentinel for "compute v<version>" (StatusForge,
      # a real versioned release); any other value is a literal moving tag
      # (Blipy's blipy-latest, Joystick Companion's joystick-latest, ...).
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ matrix.app.releaseTag }}" = "v" ]; then
            VERSION=$(node -p "require('./${{ matrix.app.versionFile }}').version")
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ matrix.app.releaseTag }}" >> "$GITHUB_OUTPUT"
          fi

      # Portable Windows build: no installer, no registry entries, no
      # Program Files — just the exe next to the same files bundle.resources
      # copies into the NSIS/MSI installers above. app_base_dir() in
      # src-tauri/src/lib.rs already stores Config.json and everything else
      # next to the exe rather than in %APPDATA%, so this works with zero
      # app-code changes.
      - name: Build portable Windows zip
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -e
          STAGE="portable-${{ matrix.app.slug }}"
          mkdir -p "$STAGE"
          cp "${{ matrix.app.path }}/src-tauri/target/release/${{ matrix.app.binName }}.exe" "$STAGE/"
          for r in ${{ matrix.app.resources }}; do
            cp -r "${{ matrix.app.path }}/$r" "$STAGE/"
          done
          ZIP_NAME="${{ matrix.app.slug }}-${{ steps.tag.outputs.tag }}-portable-windows-x64.zip"
          (cd "$STAGE" && 7z a -tzip "../$ZIP_NAME" .)
          echo "PORTABLE_ASSET=$ZIP_NAME" >> "$GITHUB_ENV"

      # Portable macOS build: the .app bundle tauri-action already produced
      # is inherently portable (drag-and-drop, no install step) — the only
      # non-portable part of the default output is the .dmg wrapper, so this
      # just zips the .app directly instead. ditto (not `zip`) preserves the
      # bundle's resource forks/extended attrs correctly.
      - name: Build portable macOS zip
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -e
          APP_PATH=$(find "${{ matrix.app.path }}/src-tauri/target/release/bundle/macos" -maxdepth 1 -name "*.app" | head -n1)
          ZIP_NAME="${{ matrix.app.slug }}-${{ steps.tag.outputs.tag }}-portable-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          echo "PORTABLE_ASSET=$ZIP_NAME" >> "$GITHUB_ENV"

      # Linux doesn't need a separate portable step — the AppImage
      # tauri-action already built above (part of "targets": "all") already
      # is the portable format; nothing extra to produce.
      - name: Upload portable build to the release
        if: matrix.os == 'windows-latest' || matrix.os == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" "${{ env.PORTABLE_ASSET }}" --clobber --repo "${{ github.repository }}"

  # Wraps each app's just-published Linux .deb into a Flatpak single-file
  # bundle and attaches it to the same release. Runs after `build` so the
  # release + .deb asset already exist to download from.
  flatpak:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: StatusForge
            id: com.bearddoddity.statusforge
            debName: statusforge.deb
            manifest: com.bearddoddity.statusforge.yml
            versionFile: src-tauri/tauri.conf.json
            releaseTag: v
          - name: Blipy
            id: com.bearddoddity.blipy
            debName: blipy.deb
            manifest: com.bearddoddity.blipy.yml
            versionFile: blipy-app/src-tauri/tauri.conf.json
            releaseTag: blipy-latest
          - name: Joystick Companion
            id: com.bearddoddity.joystickbot
            debName: joystickbot.deb
            manifest: com.bearddoddity.joystickbot.yml
            versionFile: joystick-bot/src-tauri/tauri.conf.json
            releaseTag: joystick-latest
    name: Flatpak (${{ matrix.app.name }})
    steps:
      - uses: actions/checkout@v4

      # StatusForge tags as v<version> (tauri-action expands __VERSION__ at
      # build time); Blipy and Joystick Companion always tag as their own
      # moving tag. Same "v" sentinel convention as the build job above.
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ matrix.app.releaseTag }}" = "v" ]; then
            VERSION=$(node -p "require('./${{ matrix.app.versionFile }}').version")
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ matrix.app.releaseTag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//46 org.gnome.Sdk//46

      - name: Download ${{ matrix.app.name }}'s .deb from its release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p flatpak
          gh release download "${{ steps.tag.outputs.tag }}" --pattern '*.deb' --dir flatpak --clobber --repo "${{ github.repository }}"

      - name: Rename .deb to what the manifest expects
        working-directory: flatpak
        run: mv -f *.deb ${{ matrix.app.debName }}

      - name: Build Flatpak bundle
        working-directory: flatpak
        run: |
          flatpak-builder --user --force-clean --repo=repo build ${{ matrix.app.manifest }}
          flatpak build-bundle repo ${{ matrix.app.id }}.flatpak ${{ matrix.app.id }}

      - name: Upload Flatpak bundle to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" "flatpak/${{ matrix.app.id }}.flatpak" --clobber --repo "${{ github.repository }}"

  # A release created with the default GITHUB_TOKEN (which tauri-action uses
  # above) does NOT fire the `release: published` event for other workflows
  # in this repo — that's a deliberate GitHub Actions anti-recursion rule,
  # not a bug. update-download-page.yml's `on: release` trigger is dead as a
  # result, so it's dispatched explicitly here instead once every asset
  # (including the Flatpak wraps) actually exists on the release.
  sync-download-page:
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger download-page sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update-download-page.yml --repo "${{ github.repository }}" --ref main
