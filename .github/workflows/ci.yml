# Regression-prevention CI — runs the test/lint suite on every push and PR,
# so a broken build or a config/IPC regression (like the payload-mismatch
# and key-removal bugs found in manual testing) gets caught before it lands,
# not months later. Separate from release.yml, which only builds installers
# on a version tag.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

  rust:
    name: Rust (test + clippy) — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            spark-app/src-tauri
            forge-detection

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # Formatting is OS-independent — only needs to run once.
      - name: cargo fmt check (StatusForge)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: cargo fmt check (forge-detection)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path forge-detection/Cargo.toml -- --check

      - name: cargo test (StatusForge)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo test (forge-detection)
        run: cargo test --manifest-path forge-detection/Cargo.toml

      - name: cargo clippy (StatusForge)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo clippy (forge-detection)
        run: cargo clippy --manifest-path forge-detection/Cargo.toml --all-targets -- -D warnings

      # Dependency vulnerability scan. Advisories are OS-independent, so this
      # only needs to run once rather than across the whole matrix.
      - name: Install cargo-audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-audit --locked

      - name: cargo audit (StatusForge)
        if: matrix.os == 'ubuntu-latest'
        # RUSTSEC-2026-0194/0195 (quick-xml DoS-class issues): transitive via
        # tauri-utils -> plist -> quick-xml, not a direct dependency. Fixable
        # only by Tauri bumping its own deps — re-check when upgrading tauri.
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

      - name: cargo audit (forge-detection)
        if: matrix.os == 'ubuntu-latest'
        run: cargo audit --file forge-detection/Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
