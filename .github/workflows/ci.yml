# Regression-prevention CI — runs the test/lint suite on every push and PR,
# so a broken build or a config/IPC regression (like the payload-mismatch
# and key-removal bugs found in manual testing) gets caught before it lands,
# not months later. Separate from release.yml, which only builds installers
# on a version tag.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Tauri capabilities coverage check
        run: npm run check:capabilities

  rust:
    name: Rust (test + clippy) — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            blipy-app/src-tauri
            forge-detection

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev xvfb

      # Formatting is OS-independent — only needs to run once.
      - name: cargo fmt check (StatusForge)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: cargo fmt check (forge-detection)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path forge-detection/Cargo.toml -- --check

      - name: cargo test (StatusForge)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo test (forge-detection)
        run: cargo test --manifest-path forge-detection/Cargo.toml

      # Catches launch-time crashes that unit tests can't (missing runtime
      # deps, a panic in setup() before any test ever runs) — the debug
      # binary was already built by `cargo test` above, so this just runs
      # it and checks it survives a few seconds instead of exiting/crashing.
      # First run with no Config.json/template on disk falls back to
      # AppConfig::default() in-memory (see init_app_base_dir in lib.rs), so
      # a bare checkout is a valid, representative first-run scenario here.
      - name: Startup smoke test
        shell: bash
        working-directory: src-tauri
        run: |
          set -e
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN="target/debug/app.exe"
          else
            BIN="target/debug/app"
          fi

          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            xvfb-run -a "./$BIN" &
          else
            "./$BIN" &
          fi
          APP_PID=$!

          sleep 5

          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "App exited within 5s of startup — treating as a crash."
            find . -name debug.log -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || true
            exit 1
          fi

          echo "App stayed alive for 5s — smoke test passed."

          # On Windows, Git Bash's job-control PID ($!) does not map to the
          # real Win32 process, so a plain `kill` silently no-ops and leaves
          # the app running. Kill by image name there instead; the runner is
          # a fresh, isolated VM so this can't collide with anything else.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            taskkill //F //IM app.exe 2>/dev/null || true
          else
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          fi

      - name: cargo clippy (StatusForge)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo clippy (forge-detection)
        run: cargo clippy --manifest-path forge-detection/Cargo.toml --all-targets -- -D warnings

      # Dependency vulnerability/license/duplicate-version scan. Advisories
      # and licenses are OS-independent, so this only needs to run once
      # rather than across the whole matrix. Ignored advisories/licenses are
      # documented in each crate's deny.toml, not here.
      - name: Install cargo-deny
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-deny --locked

      - name: cargo deny check (StatusForge)
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo deny check

      - name: cargo deny check (forge-detection)
        if: matrix.os == 'ubuntu-latest'
        working-directory: forge-detection
        run: cargo deny check
