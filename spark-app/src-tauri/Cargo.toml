[package]
name = "spark"
version = "1.0.0"
description = "StatusForge Spark — Dual-PC Game Detection Agent"
authors = ["BeardedOddity"]
license = "MIT"
repository = "https://github.com/BeardedOddity/StatusForge.io"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "spark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"

dirs = "5"
once_cell = "1.19"
sysinfo = "0.33"
hostname = "0.4"
