id: com.bearddoddity.joystickbot
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: joystick-bot

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  # Talks to StatusForge's local status endpoint (loopback) and to
  # Joystick.tv's API over the internet — needs real network access, not
  # just loopback.
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/tray-icon:create

modules:
  - name: joystick-bot
    buildsystem: simple
    sources:
      - type: file
        path: joystickbot.deb
      - type: file
        path: com.bearddoddity.joystickbot.metainfo.xml
    build-commands:
      - mkdir -p deb-extract
      - ar -x joystickbot.deb --output deb-extract
      - tar -C deb-extract -xf deb-extract/data.tar.gz
      - |
        BIN=$(find deb-extract/usr/bin -maxdepth 1 -type f | head -1)
        install -Dm755 "$BIN" /app/bin/joystick-bot
      - |
        DESKTOP=$(find deb-extract/usr/share/applications -name '*.desktop' | head -1)
        sed -i \
          -e 's/^Exec=.*/Exec=joystick-bot/' \
          -e 's/^Icon=.*/Icon=com.bearddoddity.joystickbot/' \
          "$DESKTOP"
        install -Dm644 "$DESKTOP" /app/share/applications/com.bearddoddity.joystickbot.desktop
      - |
        ICON=$(find deb-extract/usr/share/icons -type f -name '*.png' | head -1)
        install -Dm644 "$ICON" /app/share/icons/hicolor/128x128/apps/com.bearddoddity.joystickbot.png
      - install -Dm644 com.bearddoddity.joystickbot.metainfo.xml /app/share/metainfo/com.bearddoddity.joystickbot.metainfo.xml
