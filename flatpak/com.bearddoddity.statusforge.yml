id: com.bearddoddity.statusforge
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: statusforge

finish-args:
  # Window rendering + tray
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  # The detection engine talks to 127.0.0.1:53735 (widget/OAuth server) and
  # the Blipy LAN Hub over UDP 53735/53736 — both are loopback/LAN, not a
  # remote service, but Flatpak's sandbox still needs --share=network to
  # allow any socket at all (localhost included).
  - --share=network
  # System tray icon (Windows/Linux notification area)
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/tray-icon:create

modules:
  - name: statusforge
    buildsystem: simple
    sources:
      - type: file
        path: statusforge.deb
      - type: file
        path: com.bearddoddity.statusforge.metainfo.xml
    build-commands:
      - mkdir -p deb-extract
      - ar -x statusforge.deb --output deb-extract
      - tar -C deb-extract -xf deb-extract/data.tar.gz
      - |
        BIN=$(find deb-extract/usr/bin -maxdepth 1 -type f | head -1)
        install -Dm755 "$BIN" /app/bin/statusforge
      - |
        DESKTOP=$(find deb-extract/usr/share/applications -name '*.desktop' | head -1)
        sed -i \
          -e 's/^Exec=.*/Exec=statusforge/' \
          -e 's/^Icon=.*/Icon=com.bearddoddity.statusforge/' \
          "$DESKTOP"
        install -Dm644 "$DESKTOP" /app/share/applications/com.bearddoddity.statusforge.desktop
      - |
        ICON=$(find deb-extract/usr/share/icons -name '*128x128*' -type f | head -1)
        if [ -z "$ICON" ]; then
          ICON=$(find deb-extract/usr/share/icons -type f -name '*.png' | head -1)
        fi
        install -Dm644 "$ICON" /app/share/icons/hicolor/128x128/apps/com.bearddoddity.statusforge.png
      - install -Dm644 com.bearddoddity.statusforge.metainfo.xml /app/share/metainfo/com.bearddoddity.statusforge.metainfo.xml
