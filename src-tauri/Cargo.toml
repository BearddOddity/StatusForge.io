[package]
name = "app"
version = "0.5.0"
description = "A Tauri App"
authors = ["you"]
license = "MIT"
repository = "https://github.com/BeardedOddity/StatusForge.io"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
which = "7.0"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
keyring = "3"
dirs = "5"
hostname = "0.4"
sysinfo = "0.33"
once_cell = "1.19"
sha2 = "0.10"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = "0.21"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
url = "2.5"
base64 = "0.22"
thiserror = "2"
urlencoding = "2"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"

# Platform-specific dependencies for game detection (Windows + Linux only)
# macOS is not actively maintained for the native engine.
# macOS users should use the Python sidecar (detection_mode = "python").
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }
winreg = "0.52"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
