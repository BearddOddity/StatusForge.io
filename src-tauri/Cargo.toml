[package]
name = "app"
version = "0.5.1"
description = "A Tauri App"
authors = ["you"]
license = "MIT"
repository = "https://github.com/BeardedOddity/StatusForge.io"
edition = "2021"
rust-version = "1.84"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon", "protocol-asset", "devtools"] }
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
keyring = "3"
dirs = "5"
hostname = "0.4"
forge-detection = { path = "../forge-detection" }
sysinfo = "0.33"
once_cell = "1.19"
sha2 = "0.10"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
url = "2.5"
base64 = "0.22"
thiserror = "2"
urlencoding = "2"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
rcgen = "0.13"
hmac = "0.12"

