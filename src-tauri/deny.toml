# cargo-deny config — replaces the standalone cargo-audit CI steps (this
# tool covers the same RUSTSEC advisory checks, plus license compliance and
# duplicate-dependency-version linting in one pass). See
# https://embarkstudios.github.io/cargo-deny/ for full field docs; this file
# only sets what we actually need, not the full generated template.

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "transitive via tauri-utils -> plist -> quick-xml, not a direct dependency; re-check when upgrading tauri" },
    { id = "RUSTSEC-2026-0195", reason = "transitive via tauri-utils -> plist -> quick-xml, not a direct dependency; re-check when upgrading tauri" },
    # The following are all "unmaintained" notices (no CVE/vulnerability),
    # all transitive through Tauri's own dependency tree — not fixable from
    # this project without Tauri itself dropping/replacing these deps.
    # Re-check when upgrading tauri.
    { id = "RUSTSEC-2024-0411", reason = "unmaintained gtk-rs GTK3 bindings, transitive via tauri's Linux webview stack" },
    { id = "RUSTSEC-2024-0412", reason = "unmaintained gtk-rs GTK3 bindings, transitive via tauri's Linux webview stack" },
    { id = "RUSTSEC-2024-0413", reason = "unmaintained gtk-rs GTK3 bindings, transitive via tauri's Linux webview stack" },
    { id = "RUSTSEC-2024-0414", reason = "unmaintained gtk-rs GTK3 bindings, transitive via tauri's Linux webview stack" },
    { id = "RUSTSEC-2024-0415", reason = "unmaintained gtk-rs GTK3 bindings, transitive via tauri's Linux webview stack" },
    { id = "RUSTSEC-2024-0416", reason = "unmaintained gtk-rs GTK3 bindings, transitive via tauri's Linux webview stack" },
    { id = "RUSTSEC-2024-0417", reason = "unmaintained gtk-rs GTK3 bindings, transitive via tauri's Linux webview stack" },
    { id = "RUSTSEC-2024-0418", reason = "unmaintained gtk-rs GTK3 bindings, transitive via tauri's Linux webview stack" },
    { id = "RUSTSEC-2024-0419", reason = "unmaintained gtk-rs GTK3 bindings, transitive via tauri's Linux webview stack" },
    { id = "RUSTSEC-2024-0420", reason = "unmaintained gtk-rs GTK3 bindings, transitive via tauri's Linux webview stack" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained, transitive dependency of tauri's macro crates" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained, transitive via tauri's updater/reqwest stack" },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range unmaintained, transitive via tauri-utils -> urlpattern" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common unmaintained, transitive via tauri-utils -> urlpattern" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property unmaintained, transitive via tauri-utils -> urlpattern" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version unmaintained, transitive via tauri-utils -> urlpattern" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident unmaintained, transitive via tauri-utils -> urlpattern" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = false

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
