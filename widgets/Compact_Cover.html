<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BearddOddity Compact Cover Widget</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap');
  body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; display: flex; justify-content: center; align-items: center; -webkit-font-smoothing: antialiased; }
  .widget-container { width: 620px; display: flex; justify-content: center; align-items: center; font-family: 'Montserrat', sans-serif; position: relative; opacity: 0; transition: opacity 1s ease-in-out; }
  .info-box { width: 100%; min-height: 210px; position: relative; border-radius: 35px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 10px 10px 30px rgba(0,0,0,0.6); overflow: hidden; }
  .info-content { position: relative; padding: 20px; display: flex; flex-direction: row; align-items: center; gap: 20px; }
  /* Same 2:3 portrait shape as every other overlay's cover art (330x450) —
     just scaled down to live inside this box instead of a separate panel. */
  .cover-thumb { width: 127px; height: 173px; flex-shrink: 0; border-radius: 16px; background-size: cover; background-position: center; background-color: #111; box-shadow: 6px 6px 20px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
  .cover-thumb::after { content: ""; position: absolute; top: -50%; left: -60%; width: 30%; height: 200%; background: rgba(255, 255, 255, 0.15); transform: rotate(35deg); animation: glossShine 7s infinite ease-in-out; }
  @keyframes glossShine { 0% { left: -100%; } 15% { left: 150%; } 100% { left: 150%; } }
  .info-text { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; justify-content: center; }
  .metallic-text { background: linear-gradient(to bottom, #ffffff 0%, #dcdcdc 50%, #ffffff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.8)); display: inline-block; }
  .game-title { font-weight: 900; margin-bottom: 8px; line-height: 1.1; font-size: 24px; letter-spacing: -0.5px; word-wrap: break-word; }
  .slider-stage { position: relative; height: 60px; overflow: hidden; width: 100%; }
  .slider-track { position: absolute; width: 100%; animation: slideData 16s infinite ease-in-out; }
  @keyframes slideData {
      0%, 20% { transform: translateY(0); }
      25%, 45% { transform: translateY(-60px); }
      50%, 70% { transform: translateY(-120px); }
      75%, 95% { transform: translateY(-180px); }
      100% { transform: translateY(0); }
  }
  .slide-item { height: 60px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
  .label-text { font-weight: 800; text-transform: uppercase; letter-spacing: 2px; font-size: 13px; margin-bottom: 2px; color: rgba(255, 255, 255, 0.5); }
  .data-text { font-weight: 800; font-size: 19px; line-height: 1.1; }
</style>
</head>
<body>
<div class="widget-container" id="w">
  <div class="info-box">
    <div class="info-content">
      <div class="cover-thumb" id="a"></div>
      <div class="info-text">
        <div id="t" class="metallic-text game-title">...</div>
        <div class="slider-stage">
          <div class="slider-track">
            <div class="slide-item"><span class="label-text">Released</span><span id="r" class="metallic-text data-text">...</span></div>
            <div class="slide-item"><span class="label-text">Genre</span><span id="g" class="metallic-text data-text">...</span></div>
            <div class="slide-item"><span class="label-text">Publisher</span><span id="p" class="metallic-text data-text">...</span></div>
            <div class="slide-item"><span class="label-text">Session</span><span id="s" class="metallic-text data-text">00:00:00</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
    let lastGame = "";
    let sessionInterval;
    let widgetFadeTimer = null;
    let startTime = 0;
    let pollRate = 3000;

    // This page is only ever loaded via /forge-widget/<token>/<file>, so the
    // token that unlocked the page itself is right there in the URL — reuse
    // it for /status and /settings, which require it too.
    function getWidgetToken() {
        const parts = window.location.pathname.split('/');
        const idx = parts.indexOf('forge-widget');
        return idx >= 0 && parts[idx + 1] ? parts[idx + 1] : '';
    }

    async function initializeWidget() {
        try {
            const url = 'http://127.0.0.1:53735/settings?nocache=' + new Date().getTime() + '&token=' + encodeURIComponent(getWidgetToken());
            const setRes = await fetch(url);
            const setJson = await setRes.json();
            pollRate = (setJson.widget_poll_rate || 3) * 1000;
        } catch(e) {}
        setInterval(pollEngine, pollRate);
        pollEngine();
    }

    async function pollEngine() {
        try {
            const url = 'http://127.0.0.1:53735/status?nocache=' + new Date().getTime() + '&token=' + encodeURIComponent(getWidgetToken());
            const res = await fetch(url);
            const data = await res.json();
            const w = document.getElementById("w");

            if (data.is_playing) {
                startTime = data.start_time;
                if (!sessionInterval) sessionInterval = setInterval(updateTimer, 1000);

                if (data.game_title !== lastGame) {
                    lastGame = data.game_title;

                    if (widgetFadeTimer) clearTimeout(widgetFadeTimer);

                    w.style.opacity = "1";

                    smoothTextUpdate("t", data.game_title);
                    smoothTextUpdate("r", data.release_date || "UNKNOWN");
                    smoothTextUpdate("g", data.genre || "GAMING");
                    smoothTextUpdate("p", data.publisher || "INDIE / UNKNOWN");

                    if (data.cover_url) {
                        applyCoverArt(data.cover_url);
                    } else {
                        applyCoverArt('');
                    }

                    if (data.fade_timer > 0) {
                        widgetFadeTimer = setTimeout(() => {
                            w.style.opacity = "0";
                        }, data.fade_timer * 1000);
                    }
                }
            } else {
                w.style.opacity = "0";
                lastGame = "";
                clearInterval(sessionInterval);
                sessionInterval = null;
                if (widgetFadeTimer) clearTimeout(widgetFadeTimer);
            }
        } catch(e) {}
    }

    function smoothTextUpdate(id, text) {
        const el = document.getElementById(id);
        if(!el) return;
        el.style.opacity = 0;
        setTimeout(() => { el.innerText = text; el.style.opacity = 1; }, 500);
    }

    function applyCoverArt(url) {
        const cover = document.getElementById('a');
        if(!cover) return;
        cover.style.opacity = 0;
        setTimeout(() => {
            if(url) {
                cover.style.backgroundImage = 'url(' + url + ')';
                cover.style.backgroundColor = '#111';
            } else {
                cover.style.backgroundImage = 'none';
                cover.style.backgroundColor = '#050505';
            }
            cover.style.opacity = 1;
        }, 500);
    }

    function updateTimer() {
        if (!startTime) return;
        const diff = Math.floor(Date.now() / 1000) - Math.floor(startTime);
        if (diff < 0) return;
        const h = String(Math.floor(diff / 3600)).padStart(2, '0');
        const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
        const s = String(diff % 60).padStart(2, '0');
        const el = document.getElementById("s");
        if (el) el.innerText = h + ":" + m + ":" + s;
    }

    // Offline fallback
    setTimeout(function() {
        if (!lastGame) {
            lastGame = "__offline__";
            var w = document.getElementById("w");
            w.style.opacity = "1";
            document.getElementById("t").innerText = "StatusForge";
            document.getElementById("r").innerText = "-";
            document.getElementById("g").innerText = "OFFLINE";
            document.getElementById("p").innerText = "ENGINE DISCONNECTED";
            var cover = document.getElementById("a");
            cover.style.backgroundImage = "url('icon.png')";
            cover.style.backgroundSize = "84px 84px";
            cover.style.backgroundRepeat = "no-repeat";
            cover.style.backgroundPosition = "center";
            cover.style.backgroundColor = "#1a1a2e";
        }
    }, 1500);

    initializeWidget();
</script>
</body>
</html>
